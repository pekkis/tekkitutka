services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tekkitutka
      POSTGRES_PASSWORD: tekkitutka
      POSTGRES_DB: tekkitutka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekkitutka"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://tekkitutka:tekkitutka@db:5432/tekkitutka
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
