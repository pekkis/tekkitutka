services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tekkitutka
      POSTGRES_PASSWORD: tekkitutka
      POSTGRES_DB: tekkitutka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekkitutka"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgres://tekkitutka:tekkitutka@db:5432/tekkitutka
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: migrator
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgres://tekkitutka:tekkitutka@db:5432/tekkitutka
    command: ["./node_modules/.bin/tsx", "src/db/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://tekkitutka:tekkitutka@db:5432/tekkitutka
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:3001
      PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
